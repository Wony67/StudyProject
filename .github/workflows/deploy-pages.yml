name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "app-data.js"
      - "data/processed/past_questions.json"
      - "data/processed/expected_questions.json"
      - "data/processed/past_images/**"
      - "tools/build_app_data.py"
      - "tools/build_distribution.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild app data
        run: python .\tools\build_app_data.py

      - name: Build lite distribution
        run: python .\tools\build_distribution.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/studyproject-lite

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
